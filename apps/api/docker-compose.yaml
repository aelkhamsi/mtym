version: '3.1'

services:
  mtym_db:
    image: postgres
    container_name: mtym_db
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mtym_pgdata:/var/lib/postgresql/
    
  mtym-s3:
    image: minio/minio
    container_name: mtym-s3
    command: server /data --console-address ":9001"
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - s3_data:/data

  mtym_createbuckets:
      image: minio/mc
      depends_on:
        - mtym-s3
      entrypoint: >
        /bin/sh -c "
        until mc alias set local http://mtym-s3:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
        mc mb --ignore-existing local/$${MINIO_BUCKET_NAME};
        mc anonymous set download local/$${MINIO_BUCKET_NAME};
        exit 0;
        "
      environment:
        MINIO_ROOT_USER: ${MINIO_ROOT_USER}
        MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}

  mtym_pgadmin:
    image: dpage/pgadmin4
    container_name: mtym_pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - mtym_db
  mtym_db_backup:
    image: prodrigestivill/postgres-backup-local
    container_name: mtym_db_backup
    restart: always
    user: postgres:postgres
    volumes:
      - /root/backups:/backups   # host path where dumps land
    environment:
      - POSTGRES_HOST=mtym_db
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SCHEDULE=@daily              # cron-style; runs once a day
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    depends_on:
      - mtym_db
volumes:
  mtym_pgdata:
  s3_data:
